kubeProxyReplacement: true
k8sServiceHost: canary-poc-control-plane
k8sServicePort: 6443
gatewayAPI:
  enabled: true
  enableAlpn: false
  enableAppProtocol: false
  gatewayClassConfig:
    enabled: true
envoy:
  enabled: true
hubble:
  relay:
    enabled: true
  ui:
    enabled: true
operator:
  replicas: 1
ipam:
  mode: kubernetes
image:
  pullPolicy: IfNotPresent
cni:
  exclusive: false

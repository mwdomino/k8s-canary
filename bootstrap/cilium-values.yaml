kubeProxyReplacement: true
k8sServiceHost: kubernetes.default.svc.cluster.local
k8sServicePort: 443
gatewayAPI:
  enabled: true
  enableAlpn: false
  enableAppProtocol: false
envoy:
  enabled: true
hubble:
  relay:
    enabled: true
  ui:
    enabled: true
operator:
  replicas: 1
ipam:
  mode: kubernetes
routingMode: tunnel
tunnelProtocol: vxlan

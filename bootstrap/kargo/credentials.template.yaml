# Apply via: PAT=ghp_xxx envsubst < bootstrap/kargo/credentials.template.yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: k8s-canary-git
  namespace: canary-poc
  labels:
    kargo.akuity.io/cred-type: git
stringData:
  repoURL: https://github.com/mwdomino/k8s-canary.git
  username: mwdomino
  password: "${PAT}"

apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: canary-poc
image: rancher/k3s:v1.34.8-k3s1
servers: 1
agents: 1
kubeAPI:
  host: "0.0.0.0"
  hostIP: "0.0.0.0"
  hostPort: "6443"
ports:
  - port: "0.0.0.0:80:80"
    nodeFilters: ["loadbalancer"]
  - port: "0.0.0.0:443:443"
    nodeFilters: ["loadbalancer"]
options:
  k3s:
    extraArgs:
      - arg: "--disable=traefik"
        nodeFilters: ["server:*"]
      - arg: "--disable-kube-proxy"
        nodeFilters: ["server:*"]
      - arg: "--disable-network-policy"
        nodeFilters: ["server:*"]
      - arg: "--flannel-backend=none"
        nodeFilters: ["server:*"]

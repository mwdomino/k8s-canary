kubeProxyReplacement: true
k8sServiceHost: canary-poc-control-plane
k8sServicePort: 6443
gatewayAPI:
  enabled: true
  enableAlpn: false
  enableAppProtocol: false
  # Run Envoy in the node's host network namespace so the Gateway listens
  # on hostPort 80 directly. kind's extraPortMappings forward host:80 →
  # control-plane container:80, so this is how LAN traffic reaches the
  # Gateway without needing a LoadBalancer / cloud-provider-kind.
  hostNetwork:
    enabled: true
envoy:
  enabled: true
hubble:
  relay:
    enabled: true
  ui:
    enabled: true
operator:
  replicas: 1
ipam:
  mode: kubernetes
image:
  pullPolicy: IfNotPresent
cni:
  exclusive: false

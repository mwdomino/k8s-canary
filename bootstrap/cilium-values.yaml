kubeProxyReplacement: true
k8sServiceHost: canary-poc-control-plane
k8sServicePort: 6443
gatewayAPI:
  enabled: true
  enableAlpn: false
  enableAppProtocol: false
  # We use cloud-provider-kind (`just lb-up`) to give the LoadBalancer
  # Service an external IP and map its port to the host, so hostNetwork
  # is NOT enabled here (it would force ClusterIP and prevent the
  # Gateway from getting Programmed).
envoy:
  enabled: true
hubble:
  relay:
    enabled: true
  ui:
    enabled: true
operator:
  replicas: 1
ipam:
  mode: kubernetes
image:
  pullPolicy: IfNotPresent
cni:
  exclusive: false

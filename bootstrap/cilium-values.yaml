kubeProxyReplacement: false
gatewayAPI:
  enabled: true
  enableAlpn: false
  enableAppProtocol: false
envoy:
  enabled: true
hubble:
  relay:
    enabled: true
  ui:
    enabled: true
operator:
  replicas: 1
ipam:
  mode: kubernetes
routingMode: tunnel
tunnelProtocol: vxlan
cni:
  exclusive: false

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rollouts-dashboard
  namespace: argo-rollouts
spec:
  parentRefs:
    - name: shared
      namespace: gateway
      sectionName: http
  hostnames:
    - rollouts.__LAN_IP__.nip.io
  rules:
    - backendRefs:
        - name: argo-rollouts-dashboard
          port: 3100
